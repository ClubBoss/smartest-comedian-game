name: Database CI

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/database-ci.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/database-ci.yml"

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
      - run: supabase db start
      - run: supabase db reset
      - run: supabase test db
