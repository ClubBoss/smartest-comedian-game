name: Pilot 01 Guarded Production Sync

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/question-bank-readonly-audit.yml"
      - "ops/PILOT_01_PRODUCTION_CONTENT.json"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIVE_URL: https://smartest-comedian-game.blufferus.workers.dev
      EXPECTED_PROD_SHA: 2102da4cd265dbb06aee7de871781a4f1162f279
      QUESTION_BANK_ADMIN_KEY: ${{ secrets.QUESTION_BANK_ADMIN_KEY }}
    steps:
      - name: Checkout exact ops head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate guarded sync inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${QUESTION_BANK_ADMIN_KEY:-}" || { echo "QUESTION_BANK_ADMIN_KEY is unavailable to this workflow" >&2; exit 1; }
          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('ops/PILOT_01_PRODUCTION_CONTENT.json', 'utf8'));
          const expected = [
            ['Qualifier A', 'mary_smith_knocker_up', 'regular'],
            ['Qualifier A', 'spider_gift', 'regular'],
            ['Qualifier A', 'groom_of_the_stool', 'regular'],
            ['Qualifier A', 'mummy_brown', 'regular'],
            ['Qualifier A', 'berners_street_hoax', 'regular'],
            ['Qualifier A', 'apollo_insurance_covers', 'qualifier_super'],
            ['Qualifier B', 'garlic', 'regular'],
            ['Qualifier B', 'wife_sale', 'regular'],
            ['Qualifier B', 'cardiff_giant', 'regular'],
            ['Qualifier B', 'nasa_toilet', 'regular'],
            ['Qualifier B', 'poison_squad', 'regular'],
            ['Qualifier B', 'princess_caraboo', 'qualifier_super'],
            ['Final', 'cuttlefish_disguise', 'regular'],
            ['Final', 'cadaver_synod', 'regular'],
            ['Final', 'hanoi_rat_tails', 'team'],
            ['Final', 'roland_the_farter', 'regular'],
            ['Final', 'radithor', 'regular'],
            ['Final', 'therese_humbert', 'regular'],
            ['Final', 'poyais', 'last'],
            ['Final', 'heroin_final_abc', 'final_abc'],
          ];
          const questions = payload.questions ?? [];
          if (questions.length !== expected.length) throw new Error(`Expected 20 questions, got ${questions.length}`);
          questions.forEach((q, index) => {
            const [pack, key, role] = expected[index];
            if (q.pack !== pack || q.contentKey !== key || q.role !== role) {
              throw new Error(`Canonical slot mismatch at ${index + 1}: expected ${pack}/${key}/${role}`);
            }
            if (q.status !== 'ready') throw new Error(`${key}: status must be ready`);
            if (!q.prompt?.trim() || !q.answer?.trim()) throw new Error(`${key}: prompt/answer required`);
            if (!Array.isArray(q.hints) || q.hints.length !== 3 || q.hints.some((v) => !String(v).trim())) {
              throw new Error(`${key}: exactly three non-empty hints required`);
            }
            const tags = q.tags ?? [];
            if (!tags.includes('pilot01') || !tags.includes(`content:${key}`) || !tags.includes(`role:${role}`)) {
              throw new Error(`${key}: canonical tags missing`);
            }
            if (tags.some((tag) => String(tag).toLowerCase().includes('double_or_nothing'))) {
              throw new Error(`${key}: forbidden Double-or-Nothing tag`);
            }
          });
          const counts = Object.fromEntries(['Qualifier A', 'Qualifier B', 'Final'].map((name) => [name, questions.filter((q) => q.pack === name).length]));
          if (counts['Qualifier A'] !== 6 || counts['Qualifier B'] !== 6 || counts.Final !== 8) throw new Error(`Pack counts invalid: ${JSON.stringify(counts)}`);
          console.log(`Validated canonical payload: ${questions.length} questions; A=${counts['Qualifier A']}, B=${counts['Qualifier B']}, Final=${counts.Final}`);
          NODE

      - name: Guarded sync and strict production verification
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const base = process.env.LIVE_URL;
          const key = process.env.QUESTION_BANK_ADMIN_KEY;
          const expectedSha = process.env.EXPECTED_PROD_SHA;
          const source = JSON.parse(fs.readFileSync('ops/PILOT_01_PRODUCTION_CONTENT.json', 'utf8'));
          const canonicalPackNames = ['Qualifier A', 'Qualifier B', 'Final'];
          const sourceQuestions = source.questions;
          const expectedKeys = sourceQuestions.map((q) => q.contentKey);
          const expectedKeySet = new Set(expectedKeys);

          async function request(path, options = {}) {
            const headers = { ...(options.headers ?? {}) };
            if (path !== '/api/health') headers['x-question-bank-key'] = key;
            const response = await fetch(`${base}${path}`, { ...options, headers, redirect: 'follow' });
            const text = await response.text();
            let body;
            try { body = text ? JSON.parse(text) : {}; } catch { body = { raw: text.slice(0, 500) }; }
            if (!response.ok) throw new Error(`${options.method ?? 'GET'} ${path} failed HTTP ${response.status}: ${JSON.stringify(body)}`);
            return body;
          }

          function contentKeyOf(question) {
            const tag = (question.tags ?? []).find((value) => String(value).startsWith('content:'));
            return tag ? String(tag).slice('content:'.length) : null;
          }

          function pilotQuestions(payload) {
            return (payload.questions ?? []).filter((q) => (q.tags ?? []).includes('pilot01'));
          }

          function assertPilotSet(records, phase) {
            if (records.length !== 20) throw new Error(`${phase}: expected exactly 20 pilot01 questions, got ${records.length}`);
            const byKey = new Map();
            for (const q of records) {
              const contentKey = contentKeyOf(q);
              if (!contentKey || !expectedKeySet.has(contentKey)) throw new Error(`${phase}: unexpected/missing content key on question ${q.id}`);
              if (byKey.has(contentKey)) throw new Error(`${phase}: duplicate content key ${contentKey}`);
              if (q.status !== 'ready') throw new Error(`${phase}: ${contentKey} is not ready`);
              const roleTags = (q.tags ?? []).filter((tag) => String(tag).startsWith('role:'));
              if (roleTags.some((tag) => String(tag).toLowerCase().includes('double_or_nothing'))) throw new Error(`${phase}: forbidden Double-or-Nothing role tag`);
              byKey.set(contentKey, q);
            }
            for (const keyName of expectedKeys) if (!byKey.has(keyName)) throw new Error(`${phase}: missing ${keyName}`);
            return byKey;
          }

          const healthBefore = await request('/api/health');
          if (healthBefore.ok !== true || healthBefore.database !== 'ok') throw new Error(`Production health failed: ${JSON.stringify(healthBefore)}`);
          if (healthBefore.buildSha !== expectedSha) throw new Error(`Production SHA mismatch: expected ${expectedSha}, got ${healthBefore.buildSha}`);

          const questionsBefore = await request('/api/questions');
          const packsBefore = await request('/api/question-packs');
          const pilotBefore = pilotQuestions(questionsBefore);
          const canonicalPacksBefore = (packsBefore.packs ?? []).filter((p) => canonicalPackNames.includes(p.name));
          const nonPilotIdsBefore = new Set((questionsBefore.questions ?? []).filter((q) => !(q.tags ?? []).includes('pilot01')).map((q) => q.id));

          let byKey;
          let imported = false;
          if (pilotBefore.length === 0) {
            if (canonicalPacksBefore.length !== 0) throw new Error(`Preflight inconsistent: canonical packs exist without pilot01 questions: ${canonicalPacksBefore.map((p) => p.name).join(', ')}`);
            const cleanQuestions = sourceQuestions.map(({ contentKey, pack, role, ...question }) => question);
            const importResult = await request('/api/questions/import', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ questions: cleanQuestions }),
            });
            if (importResult.count !== 20 || !Array.isArray(importResult.ids) || importResult.ids.length !== 20) {
              throw new Error(`Import returned unexpected result: ${JSON.stringify(importResult)}`);
            }
            imported = true;
            const afterImport = await request('/api/questions');
            byKey = assertPilotSet(pilotQuestions(afterImport), 'post-import');
          } else if (pilotBefore.length === 20) {
            byKey = assertPilotSet(pilotBefore, 'resume-preflight');
            console.log('Canonical 20 already exist; skipping question import and verifying/resuming packs.');
          } else {
            throw new Error(`Unsafe partial prior sync detected: ${pilotBefore.length}/20 pilot01 questions. Refusing duplicate import.`);
          }

          const desiredPacks = canonicalPackNames.map((name) => ({
            name,
            description: `Pilot 01 · ${name} · fixed order · fresh independent game`,
            questionIds: sourceQuestions.filter((q) => q.pack === name).map((q) => byKey.get(q.contentKey).id),
          }));

          const packsCurrent = await request('/api/question-packs');
          for (const desired of desiredPacks) {
            const matches = (packsCurrent.packs ?? []).filter((p) => p.name === desired.name);
            if (matches.length > 1) throw new Error(`Duplicate production pack name: ${desired.name}`);
            if (matches.length === 1) {
              const existing = matches[0];
              if (JSON.stringify(existing.questionIds ?? []) !== JSON.stringify(desired.questionIds)) {
                throw new Error(`Existing ${desired.name} has wrong question order; refusing overwrite`);
              }
              console.log(`${desired.name}: already correct; no write.`);
              continue;
            }
            const created = await request('/api/question-packs', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify(desired),
            });
            if (!created.id) throw new Error(`${desired.name}: pack create returned no id`);
            console.log(`${desired.name}: created.`);
          }

          const healthAfter = await request('/api/health');
          if (healthAfter.ok !== true || healthAfter.database !== 'ok' || healthAfter.buildSha !== expectedSha) {
            throw new Error(`Post-sync health/SHA mismatch: ${JSON.stringify(healthAfter)}`);
          }
          const questionsAfter = await request('/api/questions');
          const packsAfter = await request('/api/question-packs');
          const pilotAfter = pilotQuestions(questionsAfter);
          const verifiedByKey = assertPilotSet(pilotAfter, 'final');
          for (const oldId of nonPilotIdsBefore) {
            if (!(questionsAfter.questions ?? []).some((q) => q.id === oldId)) throw new Error(`Pre-existing non-pilot question disappeared: ${oldId}`);
          }

          const canonicalAfter = (packsAfter.packs ?? []).filter((p) => canonicalPackNames.includes(p.name));
          if (canonicalAfter.length !== 3) throw new Error(`Expected exactly 3 canonical packs, got ${canonicalAfter.length}`);
          const summaryPacks = [];
          for (const desired of desiredPacks) {
            const matches = canonicalAfter.filter((p) => p.name === desired.name);
            if (matches.length !== 1) throw new Error(`Expected exactly one ${desired.name}, got ${matches.length}`);
            if (JSON.stringify(matches[0].questionIds ?? []) !== JSON.stringify(desired.questionIds)) throw new Error(`${desired.name}: final order mismatch`);
            summaryPacks.push({
              name: desired.name,
              count: desired.questionIds.length,
              contentKeys: sourceQuestions.filter((q) => q.pack === desired.name).map((q) => q.contentKey),
            });
          }

          const forbidden = pilotAfter.filter((q) => (q.tags ?? []).some((tag) => String(tag).toLowerCase().includes('double_or_nothing')));
          if (forbidden.length) throw new Error(`Forbidden Double-or-Nothing tags remain on ${forbidden.length} questions`);

          console.log('PILOT_01_SYNC_VERIFIED_JSON_START');
          console.log(JSON.stringify({
            importedThisRun: imported,
            productionBuildSha: healthAfter.buildSha,
            database: healthAfter.database,
            totalQuestionCount: (questionsAfter.questions ?? []).length,
            preservedNonPilotCount: nonPilotIdsBefore.size,
            pilotQuestionCount: pilotAfter.length,
            pilotReadyCount: pilotAfter.filter((q) => q.status === 'ready').length,
            canonicalPackCount: canonicalAfter.length,
            packs: summaryPacks,
            contentKeyToQuestionId: Object.fromEntries(expectedKeys.map((keyName) => [keyName, verifiedByKey.get(keyName).id])),
            forbiddenDoubleOrNothingTags: 0,
          }, null, 2));
          console.log('PILOT_01_SYNC_VERIFIED_JSON_END');
          NODE
