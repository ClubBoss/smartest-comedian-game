name: Pilot 01 V2.4 Materialize Production Closure

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pilot01-v2-4-materialize-closure.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIVE_URL: https://smartest-comedian-game.blufferus.workers.dev
      QUESTION_BANK_ADMIN_KEY: ${{ secrets.QUESTION_BANK_ADMIN_KEY }}
      SYNC_RUN_ID: "32200196955"
      SYNC_HEAD_SHA: "c14a2ff3bfa1be8a980d6bf0f2fd19b50925c962"
      EXPECTED_TARGET_SHA256: "d2406def8f5bb415640686add0285689d8efdbb35fff682cd702625d122aa229"
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Compose exact accepted V2.4 target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${QUESTION_BANK_ADMIN_KEY:-}" || { echo "QUESTION_BANK_ADMIN_KEY unavailable" >&2; exit 1; }
          git fetch --no-tags origin agent/pilot01-v2-2-production-sync agent/pilot01-v2-3-self-contained-solvability
          git show origin/agent/pilot01-v2-2-production-sync:ops/PILOT_01_V2_2_TARGET.json > /tmp/pilot01-v2-2-base.json
          git show origin/agent/pilot01-v2-3-self-contained-solvability:docs/PILOT_01_V2_3_SOLVABILITY_PATCH.json > /tmp/v23.json
          git show origin/agent/pilot01-v2-3-self-contained-solvability:docs/PILOT_01_V2_3_OVERRIDE_F3_F8.json > /tmp/v23-overrides.json
          git show origin/agent/pilot01-v2-3-self-contained-solvability:docs/PILOT_01_V2_4_PREDEPLOY_PATCH.json > /tmp/v24.json
          git show origin/agent/pilot01-v2-3-self-contained-solvability:docs/PILOT_01_V2_4_EFFECTIVE_COMPOSITION.json > /tmp/composition.json
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const base = JSON.parse(fs.readFileSync('/tmp/pilot01-v2-2-base.json', 'utf8'));
          const v23 = JSON.parse(fs.readFileSync('/tmp/v23.json', 'utf8'));
          const v23Overrides = JSON.parse(fs.readFileSync('/tmp/v23-overrides.json', 'utf8'));
          const v24 = JSON.parse(fs.readFileSync('/tmp/v24.json', 'utf8'));
          const composition = JSON.parse(fs.readFileSync('/tmp/composition.json', 'utf8'));
          const byId = new Map(base.questions.map(q => [q.questionId, structuredClone(q)]));
          const controlFields = new Set(['slot', 'changeType', 'reason', 'replacesContentKey']);
          function apply(entries, label) {
            for (const raw of entries ?? []) {
              const current = byId.get(raw.questionId);
              if (!current) throw new Error(`${label}: unknown questionId ${raw.questionId}`);
              const patch = {};
              for (const [key, value] of Object.entries(raw)) if (!controlFields.has(key)) patch[key] = value;
              byId.set(raw.questionId, { ...current, ...patch });
            }
          }
          apply(v23.changes, 'V2.3');
          apply(v23Overrides.overrides, 'V2.3 overrides');
          apply(v24.changes, 'V2.4');
          const finalQuestions = [];
          for (const pack of composition.packs ?? []) {
            for (const slot of pack.questions ?? []) {
              const q = byId.get(slot.questionId);
              if (!q) throw new Error(`Missing UUID ${slot.questionId}`);
              q.pack = pack.name;
              q.role = slot.role;
              if (q.contentKey !== slot.contentKey) throw new Error(`${slot.questionId}: contentKey mismatch`);
              const tags = (q.tags ?? []).map(String).filter(t => !t.startsWith('content:') && !t.startsWith('role:'));
              q.tags = [...new Set([...tags, `content:${q.contentKey}`, `role:${q.role}`])];
              finalQuestions.push(q);
            }
          }
          const target = {
            schemaVersion: 1,
            pilot: 'Pilot 01',
            revision: 'difficulty_v2_4',
            status: 'production_target',
            expectedProductionBuildSha: base.expectedProductionBuildSha,
            packShape: composition.packShape,
            questions: finalQuestions,
          };
          if (target.questions.length !== 20) throw new Error(`Expected 20, got ${target.questions.length}`);
          const serialized = JSON.stringify(target, null, 2) + '\n';
          const digest = crypto.createHash('sha256').update(serialized).digest('hex');
          if (digest !== process.env.EXPECTED_TARGET_SHA256) throw new Error(`Target hash drift: expected ${process.env.EXPECTED_TARGET_SHA256}, got ${digest}`);
          fs.writeFileSync('/tmp/pilot01-v2-4-target.json', serialized);
          console.log(`Target composition locked at ${digest}`);
          NODE

      - name: Read back production and write canonical docs
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const targetText = fs.readFileSync('/tmp/pilot01-v2-4-target.json', 'utf8');
          const target = JSON.parse(targetText);
          const base = process.env.LIVE_URL;
          const key = process.env.QUESTION_BANK_ADMIN_KEY;
          const packNames = ['Qualifier A', 'Qualifier B', 'Final'];
          const targetById = new Map(target.questions.map(q => [q.questionId, q]));
          async function request(path, admin = true) {
            const headers = {};
            if (admin) headers['x-question-bank-key'] = key;
            const response = await fetch(`${base}${path}`, { headers, redirect: 'follow' });
            const text = await response.text();
            let body;
            try { body = text ? JSON.parse(text) : {}; } catch { body = { raw: text.slice(0, 500) }; }
            if (!response.ok) throw new Error(`GET ${path} HTTP ${response.status}: ${JSON.stringify(body)}`);
            return body;
          }
          function normalizeTags(tags) { return [...(tags ?? [])].map(String).sort(); }
          function assertEq(actual, expected, label) {
            if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`${label} mismatch`);
          }
          function contentKeyOf(q) {
            const tag = (q.tags ?? []).find(t => String(t).startsWith('content:'));
            return tag ? String(tag).slice(8) : null;
          }
          const health = await request('/api/health', false);
          if (health.ok !== true || health.database !== 'ok' || health.buildSha !== target.expectedProductionBuildSha) throw new Error(`Health/build mismatch: ${JSON.stringify(health)}`);
          const qBody = await request('/api/questions');
          const pBody = await request('/api/question-packs');
          const all = qBody.questions ?? [];
          const byId = new Map(all.map(q => [q.id, q]));
          const pilot = all.filter(q => (q.tags ?? []).includes('pilot01'));
          const nonPilot = all.filter(q => !(q.tags ?? []).includes('pilot01'));
          if (pilot.length !== 20 || pilot.some(q => q.status !== 'ready')) throw new Error(`Pilot state mismatch: count=${pilot.length}`);
          if (all.length !== 22 || nonPilot.length !== 2) throw new Error(`Question count mismatch: total=${all.length}, nonPilot=${nonPilot.length}`);
          for (const q of target.questions) {
            const actual = byId.get(q.questionId);
            if (!actual) throw new Error(`Missing production UUID ${q.questionId}`);
            assertEq(actual.prompt, q.prompt, `${q.contentKey}.prompt`);
            assertEq(actual.answer, q.answer, `${q.contentKey}.answer`);
            assertEq(actual.answerVariants ?? [], q.answerVariants, `${q.contentKey}.answerVariants`);
            assertEq(actual.hints ?? [], q.hints, `${q.contentKey}.hints`);
            assertEq(actual.explanation ?? null, q.explanation ?? null, `${q.contentKey}.explanation`);
            assertEq(actual.hostNotes ?? null, q.hostNotes ?? null, `${q.contentKey}.hostNotes`);
            assertEq(actual.category ?? null, q.category ?? null, `${q.contentKey}.category`);
            assertEq(actual.difficulty ?? null, q.difficulty ?? null, `${q.contentKey}.difficulty`);
            assertEq(actual.sourceLabel ?? null, q.sourceLabel ?? null, `${q.contentKey}.sourceLabel`);
            assertEq(actual.sourceUrl ?? null, q.sourceUrl ?? null, `${q.contentKey}.sourceUrl`);
            assertEq(normalizeTags(actual.tags), normalizeTags(q.tags), `${q.contentKey}.tags`);
            if (contentKeyOf(actual) !== q.contentKey) throw new Error(`${q.contentKey}: content key mismatch`);
          }
          const packs = (pBody.packs ?? []).filter(p => packNames.includes(p.name));
          if (packs.length !== 3) throw new Error(`Expected 3 packs, got ${packs.length}`);
          for (const name of packNames) {
            const pack = packs.find(p => p.name === name);
            const ids = target.questions.filter(q => q.pack === name).map(q => q.questionId);
            assertEq(pack?.questionIds ?? [], ids, `${name}.ids`);
          }
          const forbidden = pilot.filter(q => (q.tags ?? []).some(t => String(t).toLowerCase().includes('double_or_nothing')));
          if (forbidden.length) throw new Error('Forbidden Double-or-Nothing tags found');

          const verifiedAt = new Date().toISOString();
          const targetSha256 = crypto.createHash('sha256').update(targetText).digest('hex');
          const productionSnapshot = {
            schemaVersion: 2,
            pilot: 'Pilot 01',
            revision: 'difficulty_v2_4',
            status: 'production_verified',
            productionVerifiedAt: verifiedAt,
            productionBuildSha: health.buildSha,
            targetSha256,
            editorialPolicy: 'Self-contained solvability; non-reflex prompts; three narrowing hints; gist-scoreable answers; source-backed wording; further desk edits frozen until human evidence.',
            questions: target.questions,
          };
          fs.writeFileSync('docs/PILOT_01_PRODUCTION_CONTENT.json', JSON.stringify(productionSnapshot, null, 2) + '\n');

          const labels = {
            elmer_mccurdy_funhouse: 'Elmer McCurdy — fake relatives',
            spider_gift: 'Spider fake gift',
            groom_of_the_stool: 'Groom of the Stool',
            bowerbird_forced_perspective: 'Bowerbird forced perspective',
            berners_street_hoax: 'Berners Street Hoax',
            apollo_insurance_covers: 'Apollo insurance covers',
            garlic: 'Ancient Egyptian garlic test',
            wife_sale: 'English wife sale',
            cardiff_giant: 'Cardiff Giant',
            flatworm_self_insemination: 'Flatworm self-insemination',
            poison_squad: 'Poison Squad',
            carlos_kaiser_red_card_escape: 'Carlos Kaiser red-card escape',
            cuttlefish_disguise: 'Cuttlefish dual display',
            cadaver_synod: 'Cadaver Synod',
            great_stork_derby: 'Great Stork Derby',
            roland_the_farter: 'Roland the Farter',
            radithor: 'Radithor lead coffin',
            therese_humbert: 'Thérèse Humbert',
            poyais: 'Poyais',
            mortsafe_body_snatchers: 'Scottish mortsafe',
          };
          const keyMap = { 'Qualifier A': 'qualifier_a', 'Qualifier B': 'qualifier_b', Final: 'final' };
          const manifest = {
            schemaVersion: 2,
            pilot: 'Pilot 01',
            revision: 'difficulty_v2_4',
            runtime: 'three_independent_games',
            questionOrderLock: 'complete',
            productionSync: 'verified',
            productionVerifiedAt: verifiedAt,
            productionBuildSha: health.buildSha,
            targetSha256,
            syncRunId: Number(process.env.SYNC_RUN_ID),
            syncHeadSha: process.env.SYNC_HEAD_SHA,
            notes: [
              'This manifest locks Pilot 01 V2.4 package membership, order, role, and verified production UUIDs.',
              'Production read-back confirmed exactly 20 Pilot questions Ready, 2 non-Pilot rows preserved, and canonical packs 6/6/8 in this order.',
              'All score handling remains ordinary/manual; no Double-or-Nothing or money/prize role is active.',
              'Editorial wording is frozen until blind-human or real-play evidence identifies a concrete failure mode.'
            ],
            packs: packNames.map(name => {
              const qs = target.questions.filter(q => q.pack === name);
              return {
                key: keyMap[name],
                name,
                description: `Pilot 01 · ${name} · fixed order · fresh independent game`,
                randomize: false,
                items: qs.map((q, i) => ({
                  order: i + 1,
                  contentKey: q.contentKey,
                  internalLabel: labels[q.contentKey] ?? q.contentKey,
                  role: q.role,
                  questionId: q.questionId,
                  wordingStatus: 'production_verified_v2_4',
                  scoreControl: 'manual'
                }))
              };
            })
          };
          fs.writeFileSync('docs/PILOT_01_PACK_MANIFEST.json', JSON.stringify(manifest, null, 2) + '\n');

          const closure = `# Pilot 01 V2.4 — Production Closure\n\nStatus: \`PRODUCTION_VERIFIED_CLOSED\`\n\n- Editorial revision: \`difficulty_v2_4\`\n- Guarded sync run: \`${process.env.SYNC_RUN_ID}\`\n- Guarded sync exact head: \`${process.env.SYNC_HEAD_SHA}\`\n- Effective target SHA256: \`${targetSha256}\`\n- Runtime production build SHA: \`${health.buildSha}\`\n- Database: \`${health.database}\`\n- Closure read-back: \`${verifiedAt}\`\n\n## Verified production state\n\n- Total Question Bank rows: **${all.length}**\n- Preserved non-Pilot rows: **${nonPilot.length}**\n- Pilot 01 rows: **${pilot.length}**\n- Pilot Ready rows: **${pilot.filter(q => q.status === 'ready').length}**\n- Canonical packs: **3**\n- Pack shape/order: **6 / 6 / 8**, exact UUID order from \`PILOT_01_PACK_MANIFEST.json\`\n- Forbidden Double-or-Nothing tags: **${forbidden.length}**\n\n## Authority\n\n\`docs/PILOT_01_PRODUCTION_CONTENT.json\` is the exact accepted V2.4 content snapshot.\n\n\`docs/PILOT_01_PACK_MANIFEST.json\` is the exact production membership/order/UUID manifest.\n\nThe product remains three independent ordinary games. Runtime code was not changed by this content sync; the production build SHA therefore intentionally remains unchanged.\n\n## Editorial stop rule\n\nV2.4 completed the self-contained-solvability, adversarial difficulty, hint-leak, gist-scoring, source-framing, and pack-balance gates at 20/20. Further wording changes require new blind-human or real-play evidence. Desk-only rewriting is classified as diminishing returns.\n`;
          fs.writeFileSync('docs/PILOT_01_V2_4_PRODUCTION_CLOSURE.md', closure);
          console.log(`Closure docs materialized from live production at ${verifiedAt}`);
          NODE

      - name: Commit docs only and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pilot01-v2-4-materialize-closure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No closure changes to commit"; exit 1; }
          git commit -m "Record verified Pilot 01 V2.4 production closure"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}